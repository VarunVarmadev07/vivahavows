<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="icon" href="./assets/images/favicon_vv.ico">

  <link rel="stylesheet" href="styles.css">

  <style>
    .gallery-page {
      padding: 100px 20px;
    }

    .gallery-title {
      font-size: 2.7rem;
      text-align: center;
      margin-bottom: 40px;
      font-weight: 300;
      letter-spacing: 4px;
    }

    .gallery-grid {
      max-width: 1500px;
      margin: auto;
      display: grid;
      gap: 25px;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    }

    .gallery-grid img {
      width: 100%;
      height: 450px;
      object-fit: cover;
      border-radius: 12px;
      transition: 0.3s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<div class="gallery-page">
  <h2 id="galleryTitle" class="gallery-title"></h2>
  <div id="galleryGrid" class="gallery-grid"></div>
</div>
