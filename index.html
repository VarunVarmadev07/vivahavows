<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="./assets/images/favicon_vv.ico">
<title>Vivaha Vows – Coming Soon</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BACKGROUND */
body {
  height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a, #2a2a2a);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* MAIN CARD */
.container {
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 50px 40px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: fadeUp 1.2s ease;
}

/* LOGO */
.logo img {
  width: 70px;
  margin-bottom: 15px;
  animation: float 3s ease-in-out infinite;
}

.logo p {
  font-size: 1.8rem;
  letter-spacing: 6px;
  font-weight: 300;
}

/* TITLE */
h1 {
  margin-top: 25px;
  font-size: 2.3rem;
  font-weight: 400;
  letter-spacing: 2px;
}

/* SUBTEXT */
.small {
  opacity: 0.7;
  margin-top: 12px;
  font-size: 1rem;
}

/* COUNTDOWN */
.countdown {
  margin-top: 30px;
  font-size: 1.4rem;
  letter-spacing: 1px;
  padding: 14px 20px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
  animation: glow 2s infinite alternate;
}

/* ANIMATIONS */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}

@keyframes glow {
  from { box-shadow: 0 0 10px rgba(255,255,255,0.05); }
  to   { box-shadow: 0 0 20px rgba(255,255,255,0.15); }
}

/* MOBILE */
@media (max-width: 600px) {
  .container {
    padding: 35px 25px;
  }

  h1 {
    font-size: 1.7rem;
  }

  .countdown {
    font-size: 1.1rem;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">
    <img src="./assets/images/favicon_vv.ico" alt="Logo">
    <p>VIVAHA VOWS</p>
  </div>

  <h1>Website Coming Soon</h1>
  <p class="small">We are launching something beautiful ✨</p>

  <div class="countdown" id="countdown"></div>
</div>

<script>
// === 2 DAY COUNTDOWN ===
let launchDate = localStorage.getItem("launchDate");

if (!launchDate) {
  const date = new Date();
  date.setDate(date.getDate() + 2);
  localStorage.setItem("launchDate", date.getTime());
  launchDate = date.getTime();
} else {
  launchDate = parseInt(launchDate);
}

function updateCountdown() {
  const now = new Date().getTime();
  const distance = launchDate - now;

  if (distance <= 0) {
    window.location.href = "main.html";
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("countdown").innerHTML =
    `${days} Days · ${hours} Hours · ${minutes} Minutes · ${seconds} Seconds`;
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
